name: Windows-Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Abhängigkeiten
        run: python -m pip install -r requirements.txt pyinstaller

      - name: ffmpeg holen (BtbN, GPL – mit x264/NVENC/QSV/AMF)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          New-Item -ItemType Directory -Force ffmpeg | Out-Null
          Get-ChildItem ffmpeg_tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1 | Copy-Item -Destination ffmpeg\ffmpeg.exe
          Get-ChildItem ffmpeg_tmp -Recurse -Filter LICENSE.txt | Select-Object -First 1 | Copy-Item -Destination ffmpeg\LICENSE-ffmpeg.txt
          .\ffmpeg\ffmpeg.exe -hide_banner -version | Select-Object -First 1
          "$PWD\ffmpeg" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: Unit-Tests
        run: python -m unittest discover -s tests -t . -v

      - name: End-to-End-Test (Engine + Relays + Live-Befehle über stdin)
        run: python tools/smoke_test.py ffmpeg\ffmpeg.exe

      - name: GUI-Start-Test
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import sys; from PySide6.QtWidgets import QApplication; from PySide6.QtCore import QTimer; from streamapp.ui import MainWindow; from streamapp.config import AppConfig; app=QApplication(sys.argv); w=MainWindow(AppConfig()); w.show(); QTimer.singleShot(1500, app.quit); app.exec(); print('GUI OK')"

      - name: Build-Kennung eintragen
        shell: pwsh
        run: |
          $sha = "${{ github.sha }}".Substring(0, 7)
          "BUILD = `"$sha`"" | Out-File -FilePath streamapp\_build.py -Encoding utf8
          $ver = python -c "import streamapp; print(streamapp.__version__)"
          "APPNAME=StreamApp-$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          python -c "import streamapp; print('Version', streamapp.__version__, streamapp.BUILD)"

      - name: EXE bauen
        run: pyinstaller --noconfirm --windowed --name StreamApp main.py

      - name: Paket zusammenstellen
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\StreamApp\ffmpeg | Out-Null
          Copy-Item ffmpeg\ffmpeg.exe dist\StreamApp\ffmpeg\
          Copy-Item ffmpeg\LICENSE-ffmpeg.txt dist\StreamApp\ffmpeg\
          Copy-Item README.md dist\StreamApp\
          # Ordner trägt die Version, damit alte und neue Fassung nicht verwechselt werden
          Rename-Item dist\StreamApp $env:APPNAME
          Compress-Archive -Path "dist\$env:APPNAME" -DestinationPath "$env:APPNAME-windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: StreamApp-windows
          path: ${{ env.APPNAME }}-windows.zip
          retention-days: 30
